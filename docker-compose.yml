services:
  # =========================================================================
  # Service 1: Soroban Builder & Development Container
  # =========================================================================
  soroban-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudnativeilorin/stellar-dev-container:latest
    container_name: soroban-builder
    volumes:
      - ./:/workspace
      - cargo-cache:/usr/local/cargo/registry
    working_dir: /workspace
    environment:
      - RUST_BACKTRACE=1
      - STELLAR_RPC_URL=http://stellar-quickstart:8000/soroban/rpc
    networks:
      - stellar-net
    command: stellar --help

  # =========================================================================
  # Service 2: Stellar Quickstart Local Standalone RPC Node
  # =========================================================================
  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: stellar-quickstart
    profiles:
      - ""
      - local
    ports:
      - "8000:8000"
    environment:
      - ENABLE_SOROBAN_RPC=true
    command: ["--local", "--enable", "rpc,horizon"]
    volumes:
      - stellar-data:/opt/stellar
    networks:
      - stellar-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://localhost:8000/soroban/rpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # =========================================================================
  # Service 3: Stellar Quickstart Public Testnet RPC Node (Optional Profile)
  # =========================================================================
  stellar-quickstart-testnet:
    image: stellar/quickstart:latest
    container_name: stellar-quickstart-testnet
    profiles:
      - testnet
    ports:
      - "8000:8000"
    environment:
      - ENABLE_SOROBAN_RPC=true
    command: ["--testnet", "--enable", "rpc,horizon"]
    volumes:
      - stellar-testnet-data:/opt/stellar
    networks:
      - stellar-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://localhost:8000/soroban/rpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  cargo-cache:
  stellar-data:
  stellar-testnet-data:

networks:
  stellar-net:
    driver: bridge
